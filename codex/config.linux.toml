model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

service_tier = "default"
sandbox_mode = "workspace-write"

[tui.keymap.global]
open_external_editor = "ctrl-e"

# ctrl-e is codex's default move_line_end; rebound so it can open the editor
# (ctrl-g, the default, is ghostty's leader key)
[tui.keymap.editor]
move_line_end = "end"

[tui.model_availability_nux]
gpt-6-astra = 4

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[plugins."gmail@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_COMMANDS"

[desktop.open-in-target-preferences]
global = "ghostty"

[features]
js_repl = false

[sandbox_workspace_write]
network_access = true

[projects."/home/pg/github/host-rust-core"]
trust_level = "trusted"

[projects."/home/pg/.dotfiles"]
trust_level = "trusted"

[projects."/home/pg/github/dotli"]
trust_level = "trusted"

[projects."/home/pg"]
trust_level = "trusted"

[projects."/home/pg/github/polkadot-app-wiki"]
trust_level = "trusted"

[projects."/home/pg/github/sdk-team"]
trust_level = "trusted"

[projects."/home/pg/github/polkadot-android-community"]
trust_level = "trusted"

[projects."/home/pg/github/issue-proxy"]
trust_level = "trusted"
