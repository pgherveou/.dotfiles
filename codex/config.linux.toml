model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

service_tier = "default"
sandbox_mode = "workspace-write"

[tui]
screen_reader_detection_done = true

[tui.keymap.global]
open_external_editor = "ctrl-e"
open_transcript = "ctrl-t"

# ctrl-e is codex's default move_line_end; rebound so it can open the editor
# (ctrl-g, the default, is ghostty's leader key)
[tui.keymap.editor]
move_line_end = "end"

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
env_vars = ["BROWSER_USE_ACCESS_EXECUTOR_ID", "BROWSER_USE_ACCESS_PIPE_PATH", "BROWSER_USE_ACCESS_VERIFYING_IDENTITY"]
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/pg/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/pg/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1021.22027"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/pg/.codex/plugins/cache/openai-bundled/browser/26.1021.22027/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[plugins."gmail@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true

[desktop.open-in-target-preferences]
global = "ghostty"

[desktop.open-in-target-preferences.perPath]
"/home/pg/github/host-rust-core" = "ghostty"

[features]
js_repl = false

[sandbox_workspace_write]
network_access = true

[projects."/home/pg/github/host-rust-core"]
trust_level = "trusted"

[projects."/home/pg/.dotfiles"]
trust_level = "trusted"

[projects."/home/pg/github/dotli"]
trust_level = "trusted"

[projects."/home/pg"]
trust_level = "trusted"

[projects."/home/pg/github/polkadot-app-wiki"]
trust_level = "trusted"

[projects."/home/pg/github/sdk-team"]
trust_level = "trusted"

[projects."/home/pg/github/polkadot-android-community"]
trust_level = "trusted"

[projects."/home/pg/github/issue-proxy"]
trust_level = "trusted"

[projects."/home/pg/github/polkadot-sdk"]
trust_level = "trusted"

[projects."/home/pg/github/seity"]
trust_level = "trusted"

[projects."/home/pg/github/product-sdk"]
trust_level = "trusted"

[projects."/home/pg/github/polkadot-ios-community"]
trust_level = "trusted"

[projects."/home/pg/github"]
trust_level = "trusted"

[projects."/home/pg/github/host-playground"]
trust_level = "trusted"

[projects."/home/pg/github/math_ex_generator"]
trust_level = "trusted"

[projects."/home/pg/github/host-image-playground-2"]
trust_level = "trusted"

[projects."/home/pg/github/sqlx-playground"]
trust_level = "trusted"

[projects."/home/pg/github/valet"]
trust_level = "trusted"

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/pg/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/home/pg/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[apps.connector_openai_pages.tools."chatgpt_space.edit_page"]
approval_mode = "approve"

[apps.connector_openai_pages.tools."chatgpt_space.manage_page_comment"]
approval_mode = "approve"

[notice]
hide_rate_limit_model_nudge = true
